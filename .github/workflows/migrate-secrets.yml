name: One-time encrypted secret migration
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Base64 encoded temporary encryption certificate
        required: true
        type: string
permissions:
  contents: read
jobs:
  encrypt:
    runs-on: ubuntu-24.04
    environment: stringlife
    steps:
      - name: Encrypt credentials for the local migration key
        env:
          RECIPIENT: ${{ inputs.recipient }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, base64, subprocess
          from pathlib import Path
          names = ['REGISTRY_TOKEN','APPLE_CERTIFICATES_P12','APPLE_CERTIFICATES_PASSWORD','APPLE_ID','APPLE_APP_PASSWORD','APPLE_TEAM_ID','MINIO_ACCESS_KEY','MINIO_SECRET_KEY']
          values = {name: os.environ[name] for name in names}
          assert all(values.values()), 'Missing credential'
          Path('recipient.pem').write_bytes(base64.b64decode(os.environ['RECIPIENT'], validate=True))
          subprocess.run(['openssl','cms','-encrypt','-aes256','-binary','-outform','DER','-out','credentials.cms','recipient.pem'], input=json.dumps(values).encode(), check=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: encrypted-migration
          path: credentials.cms
          retention-days: 1

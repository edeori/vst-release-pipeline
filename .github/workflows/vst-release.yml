name: Reusable VST release
on:
  workflow_call:
    inputs:
      product-id:
        description: Product ID registered in the Shop
        required: true
        type: string
      publish:
        description: Replace live installers after both builds succeed
        type: boolean
        default: false
    secrets:
      REGISTRY_TOKEN:
        required: true
      APPLE_CERTIFICATES_P12:
        required: true
      APPLE_CERTIFICATES_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      MINIO_ACCESS_KEY:
        required: true
      MINIO_SECRET_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: vst-release-${{ github.repository }}-${{ inputs.product-id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      bucket: ${{ steps.registry.outputs.bucket }}
      mac-key: ${{ steps.registry.outputs.mac_key }}
      windows-key: ${{ steps.registry.outputs.windows_key }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: edeori/vst-release-pipeline
          ref: 077905b05fc5c8d18854cb2625cc818a55ae1898 # Immutable shared helper revision
          path: pipeline
          persist-credentials: false
      - id: registry
        env:
          PRODUCT_ID: ${{ inputs.product-id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: python3 pipeline/scripts/registry.py
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: edeori/vst-release-pipeline
          ref: 077905b05fc5c8d18854cb2625cc818a55ae1898 # Immutable shared helper revision
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
          path: source
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATES: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash pipeline/scripts/apple-signing.sh
      - name: Build signed and notarized macOS installer
        if: runner.os == 'macOS'
        working-directory: source
        env:
          NOTARY_PROFILE: ci-notary
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ vars.INSTALLER_IDENTITY }}
        run: bash ci/package-mac.sh
      - name: Verify macOS installer
        if: runner.os == 'macOS'
        run: |
          test -s source/dist/installer.pkg
          pkgutil --check-signature source/dist/installer.pkg
          xcrun stapler validate source/dist/installer.pkg
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        run: |
          ./ci/package-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          if (!(Test-Path dist/installer.exe) -or (Get-Item dist/installer.exe).Length -eq 0) { throw 'Missing Windows installer' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ inputs.product-id }}-${{ matrix.platform }}
          path: source/dist/installer.${{ matrix.platform == 'mac' && 'pkg' || 'exe' }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"
  publish:
    if: inputs.publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installer-${{ inputs.product-id }}-*
          path: dist
          merge-multiple: true
      - name: Upload installers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          BUCKET: ${{ needs.prepare.outputs.bucket }}
          MAC_KEY: ${{ needs.prepare.outputs.mac-key }}
          WINDOWS_KEY: ${{ needs.prepare.outputs.windows-key }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s dist/installer.pkg
          test -s dist/installer.exe
          aws configure set default.s3.addressing_style path
          endpoint=https://download.mothproduction.hu
          aws --endpoint-url "$endpoint" s3 cp dist/installer.pkg "s3://$BUCKET/$MAC_KEY" --cache-control no-cache --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp dist/installer.exe "s3://$BUCKET/$WINDOWS_KEY" --cache-control no-cache --only-show-errors
          printf 'Published both installers from source commit `%s`.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
